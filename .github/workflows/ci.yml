name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libhidapi-hidraw0

      - name: Install dev dependencies
        run: pip install -e ".[dev,ble]"

      - name: Lint
        run: flake8 --config .flake8 src tests

      - name: Test
        run: pytest -q

      - name: Smoke test
        run: ./scripts/smoke-test.sh
