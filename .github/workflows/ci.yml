name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libhidapi-hidraw0

      - name: Install dev dependencies
        run: pip install -e ".[dev,ble]"

      - name: Lint
        run: flake8 --config .flake8 src tests

      - name: Test
        run: pytest -q

      - name: Smoke test
        run: ./scripts/smoke-test.sh

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trividia-truemetrix-daemon:ci .

      - name: Verify console scripts
        run: |
          for cmd in trividia-truemetrix-daemon trividia-truemetrix-api trividia-truemetrix-report \
                     trividia-truemetrix-alert-check trividia-truemetrix-prune \
                     trividia-truemetrix-find-unassigned; do
            docker run --rm --entrypoint "$cmd" trividia-truemetrix-daemon:ci --version
          done

      - name: Create fixture database and config
        run: |
          mkdir -p /tmp/docker-fixture
          python3 scripts/make-fixture-db.py /tmp/docker-fixture/readings.db
          cat > /tmp/docker-fixture/config.ini <<'EOF'
          [daemon]
          log_level = INFO
          [storage]
          db_path = /etc/trividia-truemetrix-daemon/readings.db
          EOF

      - name: Check config inside container
        run: |
          docker run --rm -v /tmp/docker-fixture:/etc/trividia-truemetrix-daemon \
            trividia-truemetrix-daemon:ci \
            --config /etc/trividia-truemetrix-daemon/config.ini --check-config

      - name: Generate a report inside container
        run: |
          docker run --rm -v /tmp/docker-fixture:/etc/trividia-truemetrix-daemon \
            --entrypoint trividia-truemetrix-report \
            trividia-truemetrix-daemon:ci \
            --config /etc/trividia-truemetrix-daemon/config.ini \
            --output /etc/trividia-truemetrix-daemon/report.pdf
          test -s /tmp/docker-fixture/report.pdf

      # Only publishes on pushes to main -- a PR's CI run builds and smoke
      # tests the image (above) but never reaches these steps, since
      # github.event_name is "pull_request" there, not "push".
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/trividia-truemetrix-daemon"
          docker tag trividia-truemetrix-daemon:ci "${image}:latest"
          docker tag trividia-truemetrix-daemon:ci "${image}:${{ github.sha }}"
          docker push "${image}:latest"
          docker push "${image}:${{ github.sha }}"
