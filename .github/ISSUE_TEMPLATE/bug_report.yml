name: Bug report
description: Report a problem with trividia-truemetrix-daemon
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `pip show trividia-truemetrix-daemon` or the commit/tag in use
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      description: Which part of the daemon is this about?
      options:
        - Sync daemon (trividia-truemetrix-daemon)
        - Onboarding / assignment (ntfy, dunstify, /api/v1/assign-device)
        - Alerting (trividia-truemetrix-alert-check)
        - Reports (trividia-truemetrix-report)
        - HTTP API (trividia-truemetrix-api)
        - MQTT publishing
        - Pruning (trividia-truemetrix-prune)
        - Not sure / other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, and how the meter is connected (docking station vs. direct USB cable)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you run, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run with `--verbose` (CLI) or check `journalctl -u trividia-truemetrix-daemon` and paste relevant output.
      render: shell
