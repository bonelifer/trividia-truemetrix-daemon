[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trividia-truemetrix-daemon"
version = "0.1.0"
description = "Standalone USB HID daemon that syncs Trividia TRUE METRIX glucose readings to SQLite"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "trividia-truemetrix-hid @ git+https://github.com/bonelifer/trividia-truemetrix-hid.git",
    "apprise>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/bonelifer/trividia-truemetrix-daemon"

[project.scripts]
trividia-truemetrix-daemon = "trividia_truemetrix_daemon.cli:main"
trividia-truemetrix-api = "trividia_truemetrix_daemon.api:main"
trividia-truemetrix-find-unassigned = "trividia_truemetrix_daemon.find_unassigned:main"
trividia-truemetrix-report = "trividia_truemetrix_daemon.report:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trividia_truemetrix_daemon"]

[tool.hatch.metadata]
allow-direct-references = true
